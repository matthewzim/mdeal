<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly Deal Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Loading Overlay ─────────────────────────────────────────── -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- ── Action Overlay ──────────────────────────────────────────── -->
  <div id="action-overlay"></div>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- LOGIN SCREEN                                                  -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <div id="login-screen" class="screen active">
    <!-- Player Stats Dashboard (upper-right corner) -->
    <div id="player-stats-dashboard" class="stats-dashboard">
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-value" id="stat-games">0</div>
          <div class="stat-label">Games</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-winrate">0%</div>
          <div class="stat-label">Win Rate</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-elo">1200</div>
          <div class="stat-label">Rating</div>
        </div>
      </div>
    </div>

    <div class="login-box">
      <h1>MDEAL.IO</h1>
      <h2>Online Multiplayer Card Game</h2>

      <div class="input-group">
        <input type="text" id="input-username" placeholder="Your Name" maxlength="20" autocomplete="off">
      </div>

      <div class="create-room-row">
        <button class="btn btn-create" id="btn-create-room">Create Room</button>
        <div class="toggle-container" id="toggle-public">
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-public-input">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-label" id="toggle-label">Private</span>
        </div>
      </div>

      <div id="public-games-section">
        <h3 class="public-games-heading">Public Games</h3>
        <div id="online-player-count" style="text-align:center; font-size:0.95em; color:#aaa; margin-bottom:8px">0 Players Online</div>
        <div id="public-games-list" class="public-games-list">
          <div class="public-games-empty">No public games available</div>
        </div>
        <button class="btn btn-refresh" id="btn-refresh-public" style="width:100%; margin-top:8px">Refresh List</button>
      </div>

      <div class="input-group">
        <input type="text" id="input-room-code" placeholder="Room Code (e.g. ABCDEF)" maxlength="6" style="text-transform:uppercase; letter-spacing:4px; text-align:center" autocomplete="off">
      </div>

      <button class="btn btn-join" id="btn-join-room" style="width:100%; margin-bottom:12px">Join Private Room</button>

      <button class="btn btn-computer" id="btn-play-computer" style="width:100%">Play Against Computer</button>
    </div>

    <!-- Computer setup overlay -->
    <div id="computer-setup-modal">
      <div class="computer-setup-box">
        <h3>Play Against Computer</h3>
        <p class="computer-setup-hint">Choose how many computer opponents (1–3):</p>
        <div class="computer-count-buttons">
          <button class="btn btn-computer-count" data-count="1">1 Opponent</button>
          <button class="btn btn-computer-count" data-count="2">2 Opponents</button>
          <button class="btn btn-computer-count" data-count="3">3 Opponents</button>
        </div>
        <button class="btn btn-cancel" id="btn-cancel-computer" style="width:100%; margin-top:12px">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- LOBBY SCREEN                                                  -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <div id="lobby-screen" class="screen">
    <div class="lobby-box">
      <h2>Game Lobby</h2>
      <div id="lobby-room-code-section">
        <div class="room-code-display" id="lobby-room-code">------</div>
        <div class="room-code-hint">Click to copy room code. Share it with friends!</div>
      </div>
      <div id="lobby-public-badge" class="lobby-public-badge" style="display:none">PUBLIC GAME</div>

      <div id="lobby-player-list"></div>

      <div class="lobby-buttons">
        <button class="btn btn-ready" id="btn-ready">Toggle Ready</button>
        <button class="btn btn-primary" id="btn-start-game" style="display:none" disabled>
          Waiting for players...
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- GAME SCREEN                                                   -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <div id="game-screen" class="screen">
    <div class="game-table">
      <!-- Opponent seats -->
      <div class="opponent-seat" id="opponent-top-left"></div>
      <div class="opponent-seat" id="opponent-top"></div>
      <div class="opponent-seat" id="opponent-right"></div>
      <div class="opponent-seat" id="opponent-left"></div>

      <!-- Center play area -->
      <div class="center-area">
        <!-- Played card display (centered in game area) -->
        <div id="played-card-display"></div>
        <div id="deck-and-discard"></div>
      </div>

      <!-- Game info & log -->
      <div class="game-info-panel">
        <div id="game-info"></div>
        <div id="game-log"></div>
        <div id="chat-panel">
          <div class="chat-header">Chat</div>
          <div id="chat-messages"></div>
          <div id="chat-input-row">
            <input type="text" id="chat-input" placeholder="Type a message..." maxlength="200" />
            <button id="chat-send-btn" onclick="UI.sendChat()">Send</button>
          </div>
        </div>
        <div id="action-bar"></div>
      </div>

      <!-- My properties (left side, right-aligned to middle) -->
      <div class="my-props-area">
        <div id="my-properties"></div>
      </div>

      <!-- My bank (right side, left-aligned to middle) -->
      <div class="my-bank-area">
        <div id="my-bank"></div>
      </div>

      <!-- Player hand (center) -->
      <div class="hand-area">
        <div id="my-hand"></div>
      </div>

      <!-- Turn timer (online play only) -->
      <div id="turn-timer" class="turn-timer" style="display:none">
        <svg class="timer-ring" viewBox="0 0 60 60">
          <circle class="timer-ring-bg" cx="30" cy="30" r="26" />
          <circle class="timer-ring-progress" cx="30" cy="30" r="26" />
        </svg>
        <span class="timer-text" id="timer-text">0:30</span>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- SCRIPTS                                                       -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Game modules -->
  <script src="game-engine/deck.js"></script>
  <script src="game-engine/rules.js"></script>
  <script src="game-engine/gameEngine.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="computerPlayer.js"></script>
  <script src="clientGame.js"></script>
  <script src="ui.js"></script>

  <!-- Init -->
  <script>
    async function initApp() {
      UI.init();

      // Ensure persistent player ID exists
      ClientGame.getOrCreatePersistentId();

      // Restore saved username
      const savedName = ClientGame.getSavedUsername();
      if (savedName) {
        document.getElementById('input-username').value = savedName;
      }

      // Populate stats dashboard
      UI.updateStatsDashboard();

      try {
        SupabaseClient.init();

        // Try to restore Supabase session
        let session = await SupabaseClient.getSession();
        if (!session) {
          await SupabaseClient.signInAnonymously();
        }

        // Try to reconnect to an active game
        const reconnected = await ClientGame.tryReconnect();
        if (reconnected) {
          const gs = ClientGame.getGameState();
          if (gs) {
            UI.showGameScreen();
            UI.renderGame(gs, ClientGame.getPlayerId(), ClientGame.getPlayerNames());
            UI.showToast('Reconnected to your game!');
            return;
          }
        }

        UI.showToast('Connected to Supabase!');
      } catch (err) {
        UI.showError('Connection failed: ' + err.message);
        console.error(err);
      }
    }

    // Boot
    initApp();
  </script>

</body>
</html>
